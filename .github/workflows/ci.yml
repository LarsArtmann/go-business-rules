# CI gates every Go module in this repository (root + nested modules).
#
# NOTE (2026-09-14): the workflow is currently DISABLED on GitHub and every
# run since 2026-06 failed within seconds — not because of this file, but
# because the jobs were rejected by GitHub billing: "The job was not started
# because recent account payments have failed or your spending limit needs to
# be increased" (see run 29447520877). Fix billing / raise the spending
# limit, then run: gh workflow enable CI
# Until then the local gates are authoritative:
#
#	nix run .#check-all

name: CI

on:
  push:
    branches: [master, main]
    paths-ignore:
      - "**/*.md"
      - docs/**
      - LICENSE
      - .gitignore
      - "**/*.svg"
      - "**/*.png"
  pull_request:
    branches: [master, main]
    paths-ignore:
      - "**/*.md"
      - docs/**
      - LICENSE
      - .gitignore
      - "**/*.svg"
      - "**/*.png"

env:
  GOEXPERIMENT: jsonv2

jobs:
  test:
    name: Test (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [".", "adapters/cqrslite", "examples/sse", "listeners/otel"]

    defaults:
      run:
        working-directory: ${{ matrix.module }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          files: ./coverage.out
          fail_ci_if_error: false

    timeout-minutes: 15

  lint:
    name: Lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [".", "adapters/cqrslite", "examples/sse", "listeners/otel"]

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
        with:
          version: v2.12
          args: --timeout=5m
          working-directory: ${{ matrix.module }}

    timeout-minutes: 15

  build:
    name: Build (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [".", "adapters/cqrslite", "examples/sse", "listeners/otel"]

    defaults:
      run:
        working-directory: ${{ matrix.module }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Build
        run: go build -v ./...

      - name: Verify build
        run: go vet ./...

    timeout-minutes: 15

  security:
    name: Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"
          cache: true

      - name: Run Gosec Security Scanner
        uses: securego/gosec@955a68d0d19f4afb7503068f95059f7d0c529017 # v2.22.3
        env:
          GOEXPERIMENT: jsonv2
        with:
          args: ./...

    timeout-minutes: 15

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
