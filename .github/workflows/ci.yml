# CI gates every Go module in this repository (root + nested modules).
#
# NOTE (2026-09-14): the workflow is currently DISABLED on GitHub and every
# run since 2026-06 failed within seconds — not because of this file, but
# because the jobs were rejected by GitHub billing: "The job was not started
# because recent account payments have failed or your spending limit needs to
# be increased" (see run 29447520877). Fix billing / raise the spending
# limit, then run: gh workflow enable CI
# Until then the local gates are authoritative:
#
#	nix run .#check-all

name: CI

on:
  push:
    branches: [master, main]
    paths-ignore:
      - "**/*.md"
      - docs/**
      - LICENSE
      - .gitignore
      - "**/*.svg"
      - "**/*.png"
  pull_request:
    branches: [master, main]
    paths-ignore:
      - "**/*.md"
      - docs/**
      - LICENSE
      - .gitignore
      - "**/*.svg"
      - "**/*.png"

env:
  GOEXPERIMENT: jsonv2

jobs:
  test:
    name: Test (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [".", "adapters/cqrslite", "examples/sse", "listeners/otel"]

    defaults:
      run:
        working-directory: ${{ matrix.module }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage.out
          fail_ci_if_error: false

    timeout-minutes: 15

  lint:
    name: Lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [".", "adapters/cqrslite", "examples/sse", "listeners/otel"]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12
          args: --timeout=5m
          working-directory: ${{ matrix.module }}

    timeout-minutes: 15

  build:
    name: Build (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [".", "adapters/cqrslite", "examples/sse", "listeners/otel"]

    defaults:
      run:
        working-directory: ${{ matrix.module }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Build
        run: go build -v ./...

      - name: Verify build
        run: go vet ./...

    timeout-minutes: 15

  security:
    name: Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: true

      - name: Run Gosec Security Scanner
        uses: securego/gosec@deb54465fea23d19a77f037e11e6589021f8501d # v2.29.0
        env:
          GOEXPERIMENT: jsonv2
        with:
          args: ./...

    timeout-minutes: 15

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
