# CI gates every Go module in this repository (root + nested modules).
#
# NOTE (2026-09-17): the repository is now PUBLIC, so GitHub Actions are free
# and the 2026-06..09 billing rejections ("The job was not started because
# recent account payments have failed") no longer apply. If a run is rejected
# again, the cause is account billing/spending-limit, not this workflow.

name: CI

on:
  push:
    branches: [master, main]
    paths-ignore:
      - "**/*.md"
      - docs/**
      - LICENSE
      - .gitignore
      - "**/*.svg"
      - "**/*.png"
  pull_request:
    branches: [master, main]
    paths-ignore:
      - "**/*.md"
      - docs/**
      - LICENSE
      - .gitignore
      - "**/*.svg"
      - "**/*.png"

env:
  GOEXPERIMENT: jsonv2

jobs:
  test:
    name: Test (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [".", "adapters/cqrslite", "examples/sse", "listeners/otel"]

    defaults:
      run:
        working-directory: ${{ matrix.module }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@0b35c9ecc4f0529d0eb674914510c22f85b196b4 # v7.1.0
        with:
          files: ./coverage.out
          fail_ci_if_error: false

    timeout-minutes: 15

  lint:
    name: Lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [".", "adapters/cqrslite", "examples/sse", "listeners/otel"]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12
          args: --timeout=5m
          working-directory: ${{ matrix.module }}

    timeout-minutes: 15

  build:
    name: Build (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [".", "adapters/cqrslite", "examples/sse", "listeners/otel"]

    defaults:
      run:
        working-directory: ${{ matrix.module }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Build
        run: go build -v ./...

      - name: Verify build
        run: go vet ./...

    timeout-minutes: 15

  security:
    name: Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: true

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0

      - name: Run gosec
        run: gosec -fmt=json -out=gosec-report.json ./...

      - name: Verify gosec scanned the module
        run: |
          files=$(jq -r '.Stats.files' gosec-report.json)
          echo "gosec scanned ${files} file(s)"
          if [ "${files}" -lt 1 ]; then
            echo "::error::gosec reported zero files scanned; the security gate did not run"
            exit 1
          fi

    timeout-minutes: 15

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
