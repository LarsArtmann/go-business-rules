version: "2"
run:
    timeout: 5m
    go: 1.26.2
    build-tags:
        - goexperiment.arenas
        - goexperiment.goroutineleakprofile
        - goexperiment.jsonv2
        - goexperiment.runtimesecret
        - goexperiment.simd
    allow-parallel-runners: true
    allow-serial-runners: true
output:
    formats: {}
linters:
    enable:
        - arangolint
        - asasalint
        - asciicheck
        - bidichk
        - bodyclose
        - canonicalheader
        - containedctx
        - contextcheck
        - copyloopvar
        - cyclop
        - decorder
        - depguard
        - dogsled
        - dupl
        - dupword
        - durationcheck
        - embeddedstructfieldcheck
        - err113
        - errcheck
        - errchkjson
        - errname
        - errorlint
        - exhaustive
        - exhaustruct
        - exptostd
        - fatcontext
        - forbidigo
        - forcetypeassert
        - funlen
        - ginkgolinter
        - gocheckcompilerdirectives
        - gochecknoglobals
        - gochecknoinits
        - gochecksumtype
        - gocognit
        - goconst
        - gocritic
        - gocyclo
        - godoclint
        - godot
        - godox
        - goheader
        - gomoddirectives
        - gomodguard
        - goprintffuncname
        - gosec
        - gosmopolitan
        - govet
        - grouper
        - iface
        - importas
        - inamedparam
        - ineffassign
        - interfacebloat
        - intrange
        - iotamixing
        - ireturn
        - loggercheck
        - maintidx
        - makezero
        - mirror
        - misspell
        - mnd
        - modernize
        - musttag
        - nakedret
        - nestif
        - nilerr
        - nilnesserr
        - nilnil
        - nlreturn
        - noctx
        - noinlineerr
        - nolintlint
        - nonamedreturns
        - nosprintfhostport
        - paralleltest
        - perfsprint
        - prealloc
        - predeclared
        - promlinter
        - protogetter
        - reassign
        - recvcheck
        - revive
        - rowserrcheck
        - sloglint
        - spancheck
        - sqlclosecheck
        - staticcheck
        - tagalign
        - tagliatelle
        - testableexamples
        - testifylint
        - testpackage
        - thelper
        - tparallel
        - unconvert
        - unparam
        - unqueryvet
        - unused
        - usestdlibvars
        - usetesting
        - varnamelen
        - wastedassign
        - whitespace
        - wrapcheck
        - wsl_v5
        - zerologlint
    default: standard
    settings:
        depguard:
            rules:
                main:
                    allow:
                        - $gostd
                        - $module
        exhaustruct:
            exclude:
                - os/exec.Cmd
        goconst:
            min-len: 3
            min-occurrences: 3
        gocritic:
            disabled-checks:
                - dupImport
                - ifElseChain
                - octalLiteral
                - whyNoLint
        gocyclo:
            min-complexity: 15
        godot:
            scope: toplevel
        govet:
            disable:
                - fieldalignment
        ireturn:
            allow:
                - github.com/artmann/businessrules.Rule
                - error
        misspell:
            locale: US
        revive:
            rules:
                - name: context-as-argument
                - name: context-keys-type
                - name: error-return
                - name: error-strings
                - name: error-naming
                - name: exported
                - name: if-return
                - name: increment-decrement
                - name: var-naming
                - name: var-declaration
                - name: package-comments
                - name: range
                - name: receiver-naming
                - name: time-naming
                - name: unexported-return
                - name: indent-error-flow
                - name: errorf
                - name: empty-block
                - name: superfluous-else
                - name: unreachable-code
                - name: redefines-builtin-id
    exclusions:
        rules:
            - path: _test\.go
              linters:
                - dupl
                - gocyclo
                - gosec
                - revive
                - gochecknoglobals
            - path: example_test\.go
              linters:
                - dupl
                - forbidigo
            - path: benchmark_test\.go
              linters:
                - testpackage
            - path: fuzz_test\.go
              linters:
                - testpackage
            - path: _test\.go
              linters:
                - depguard
            - path: _test\.go
              linters:
                - err113
            - path: builders.*
              linters:
                - err113
formatters:
    enable:
        - gci
        - goimports
        - gofumpt
        - golines
    settings:
        gofmt:
            simplify: true
        goimports:
            local-prefixes:
                - github.com/artmann/businessrules
issues: {}
